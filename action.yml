name: 'droast — Dockerfile linter'
description: 'Lint Dockerfiles with all 85 rules and report findings as GitHub annotations.' # droast:rule-count
author: 'immanuwell'

branding:
  icon: 'alert-triangle'
  color: 'red'

inputs:
  files:
    description: >
      Dockerfile(s) to lint. Space-separated list or glob pattern.
      Defaults to 'Dockerfile' in the repository root.
    required: false
    default: 'Dockerfile'
  min-severity:
    description: 'Minimum severity to report: info, warning, or error (empty uses droast.toml or the built-in default)'
    required: false
    default: ''
  preset:
    description: 'Built-in preset: minimal, security, performance, production, or strict'
    required: false
    default: ''
  category:
    description: 'Comma-separated rule categories to run'
    required: false
    default: ''
  skip-category:
    description: 'Comma-separated rule categories to skip'
    required: false
    default: ''
  skip:
    description: 'Comma-separated rule IDs to skip, e.g. DF001,DF012'
    required: false
    default: ''
  no-roast:
    description: 'Suppress the snarky messages — show technical findings only'
    required: false
    default: 'false'
  no-fail:
    description: 'Exit 0 even when errors are found (non-blocking / advisory mode)'
    required: false
    default: 'false'
  baseline:
    description: 'Path in the repository to a droast baseline JSON file'
    required: false
    default: ''
  only-new:
    description: 'Report only findings absent from baseline (requires baseline)'
    required: false
    default: 'false'
  engine:
    description: 'Build-context conventions: docker or podman'
    required: false
    default: ''
  image-tag:
    description: 'droast image tag to pull (e.g. latest, 1.4.5)' # droast:release-version
    required: false
    default: 'latest'

runs:
  using: composite
  steps:
    - name: Run droast
      shell: bash
      run: |
        ARGS=()

        ARGS+=(--format github)

        if [[ -n "${{ inputs.min-severity }}" ]]; then
          ARGS+=(--min-severity "${{ inputs.min-severity }}")
        fi

        if [[ -n "${{ inputs.preset }}" ]]; then
          ARGS+=(--preset "${{ inputs.preset }}")
        fi

        if [[ -n "${{ inputs.category }}" ]]; then
          ARGS+=(--category "${{ inputs.category }}")
        fi

        if [[ -n "${{ inputs.skip-category }}" ]]; then
          ARGS+=(--skip-category "${{ inputs.skip-category }}")
        fi

        if [[ -n "${{ inputs.skip }}" ]]; then
          ARGS+=(--skip "${{ inputs.skip }}")
        fi

        if [[ "${{ inputs.no-roast }}" == "true" ]]; then
          ARGS+=(--no-roast)
        fi

        if [[ "${{ inputs.no-fail }}" == "true" ]]; then
          ARGS+=(--no-fail)
        fi

        if [[ -n "${{ inputs.baseline }}" ]]; then
          ARGS+=(--baseline "${{ inputs.baseline }}")
        fi

        if [[ "${{ inputs.only-new }}" == "true" ]]; then
          if [[ -z "${{ inputs.baseline }}" ]]; then
            echo "::error title=droast configuration::'only-new' requires the 'baseline' input."
            exit 2
          fi
          ARGS+=(--only-new)
        fi

        if [[ -n "${{ inputs.engine }}" ]]; then
          ARGS+=(--engine "${{ inputs.engine }}")
        fi

        docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          "ghcr.io/immanuwell/droast:${{ inputs.image-tag }}" \
          "${ARGS[@]}" \
          ${{ inputs.files }}
