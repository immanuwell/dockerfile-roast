name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: droast-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_name: droast-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: droast-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: droast-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: droast-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get install -y musl-tools

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build
        env:
          DROAST_VERSION: ${{ github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/droast"
          [[ "${{ runner.os }}" == "Windows" ]] && src="${src}.exe"
          cp "$src" "${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  publish-crate:
    name: crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate crate version
        id: crate
        shell: bash
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "dockerfile-roast") | .version')

          if [[ "$crate_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Cargo.toml version $crate_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

          echo "version=$crate_version" >> "$GITHUB_OUTPUT"

          if (cd /tmp && cargo info "dockerfile-roast@$crate_version" --registry crates-io >/dev/null 2>&1); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "dockerfile-roast $crate_version is already published; skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test crate
        if: steps.crate.outputs.publish == 'true'
        run: cargo test --locked

      - name: Verify package
        if: steps.crate.outputs.publish == 'true'
        run: cargo publish --dry-run --locked

      - name: Publish crate
        if: steps.crate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish --locked

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum droast-* > sha256sums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
