name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  metadata:
    name: Public metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: sync-public-metadata
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag version
        shell: bash
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "dockerfile-roast") | .version')
          if [[ "$crate_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Cargo.toml version $crate_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Checkout main for public metadata
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Synchronize release examples with the tag
        run: ./scripts/update-public-metadata.sh --version "$GITHUB_REF_NAME"

      - name: Commit synchronized metadata
        shell: bash
        env:
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
        run: |
          git add README.md docs/index.html action.yml wasmer.toml
          if git diff --staged --quiet; then
            echo "Public metadata is already synchronized."
            exit 0
          fi

          : "${GIT_AUTHOR_NAME:?missing GIT_AUTHOR_NAME secret}"
          : "${GIT_AUTHOR_EMAIL:?missing GIT_AUTHOR_EMAIL secret}"
          : "${GIT_COMMITTER_NAME:?missing GIT_COMMITTER_NAME secret}"
          : "${GIT_COMMITTER_EMAIL:?missing GIT_COMMITTER_EMAIL secret}"
          git commit -m "docs: sync public metadata for $GITHUB_REF_NAME"
          git push

  build:
    name: ${{ matrix.asset_name }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: droast-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_name: droast-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: droast-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: droast-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: droast-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get install -y musl-tools

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build
        env:
          DROAST_VERSION: ${{ github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/droast"
          [[ "${{ runner.os }}" == "Windows" ]] && src="${src}.exe"
          cp "$src" "${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  publish-crate:
    name: crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate crate version
        id: crate
        shell: bash
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "dockerfile-roast") | .version')

          if [[ "$crate_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Cargo.toml version $crate_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

          echo "version=$crate_version" >> "$GITHUB_OUTPUT"

          if (cd /tmp && cargo info "dockerfile-roast@$crate_version" --registry crates-io >/dev/null 2>&1); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "dockerfile-roast $crate_version is already published; skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test crate
        if: steps.crate.outputs.publish == 'true'
        run: cargo test --locked

      - name: Verify package
        if: steps.crate.outputs.publish == 'true'
        run: cargo publish --dry-run --locked

      - name: Publish crate
        if: steps.crate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish --locked

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum droast-* > sha256sums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  update-homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Require tap token
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "HOMEBREW_TAP_TOKEN is required to update immanuwell/homebrew-droast." >&2
          exit 1

      - uses: actions/checkout@v6

      - name: Download checksums from release
        run: |
          curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sha256sums.txt" \
            -o sha256sums.txt

      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          repository: immanuwell/homebrew-droast
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Generate updated formula
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          export BASE="https://github.com/${REPOSITORY}/releases/download/${VERSION}"
          export SHA_MACOS_ARM="$(awk '/droast-macos-arm64$/{print $1}' sha256sums.txt)"
          export SHA_MACOS_X86="$(awk '/droast-macos-x86_64$/{print $1}' sha256sums.txt)"
          export SHA_LINUX_ARM="$(awk '/droast-linux-arm64$/{print $1}' sha256sums.txt)"
          export SHA_LINUX_X86="$(awk '/droast-linux-x86_64$/{print $1}' sha256sums.txt)"
          envsubst < homebrew/droast.rb.tmpl > tap/Formula/droast.rb

      - name: Commit and push
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/droast.rb
          git diff --staged --quiet || git commit -m "chore: update droast to ${{ github.ref_name }}"
          git push
