name: Publish Docker image and Wasmer package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. 1.0.0)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/droast
  WASMER_NAMESPACE: ${{ vars.WASMER_NAMESPACE || github.repository_owner }}

jobs:
  metadata:
    name: Public metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Reject stale image metadata
        run: ./scripts/update-public-metadata.sh --check

  build-and-push:
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DROAST_VERSION=${{ inputs.tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-wasmer:
    name: Publish Wasmer package
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: wasmer-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasmer-${{ runner.os }}-

      - name: Install Wasmer
        run: |
          curl https://get.wasmer.io -sSfL | sh -s "v 7.1.0"
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmer/bin/wasmer" --version

      - name: Build and validate package
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: ./scripts/build-wasmer-package.sh

      - name: Publish package
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ -z "$WASMER_TOKEN" ]]; then
            echo "WASMER_TOKEN repository secret is required to publish the package" >&2
            exit 1
          fi

          if wasmer package download \
            "$WASMER_NAMESPACE/droast@$VERSION" \
            --out-path /tmp/droast.webc \
            --quiet; then
            echo "$WASMER_NAMESPACE/droast@$VERSION is already published; skipping"
            exit 0
          fi

          wasmer publish \
            --namespace "$WASMER_NAMESPACE" \
            --name droast \
            --version "$VERSION" \
            --non-interactive \
            --wait=container \
            .
