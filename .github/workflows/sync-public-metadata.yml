name: Sync public metadata

on:
  push:
    branches: [main]
    paths:
      - 'src/rules.rs'
      - 'src/main.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - 'docs/index.html'
      - 'action.yml'
      - 'wasmer.toml'
      - 'scripts/update-public-metadata.sh'
      - 'scripts/update-rules-readme.sh'
      - '.github/workflows/sync-public-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-public-metadata
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate public metadata
        run: ./scripts/update-public-metadata.sh --version "$(git describe --tags --abbrev=0)"

      - name: Validate generated changes
        run: git diff --check

      - name: Commit synchronized metadata
        shell: bash
        env:
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
        run: |
          git add README.md docs/index.html action.yml wasmer.toml
          if git diff --staged --quiet; then
            echo "Public metadata is already synchronized."
            exit 0
          fi

          : "${GIT_AUTHOR_NAME:?missing GIT_AUTHOR_NAME secret}"
          : "${GIT_AUTHOR_EMAIL:?missing GIT_AUTHOR_EMAIL secret}"
          : "${GIT_COMMITTER_NAME:?missing GIT_COMMITTER_NAME secret}"
          : "${GIT_COMMITTER_EMAIL:?missing GIT_COMMITTER_EMAIL secret}"
          git commit -m "docs: sync public metadata"
          git push
