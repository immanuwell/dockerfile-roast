name: Publish VS Code Extension

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  publish:
    # Only run when the Release workflow succeeded (binaries exist in the release).
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - vsce_target: linux-x64
            asset: droast-linux-x86_64
          - vsce_target: linux-arm64
            asset: droast-linux-arm64
          - vsce_target: darwin-x64
            asset: droast-macos-x86_64
          - vsce_target: darwin-arm64
            asset: droast-macos-arm64
          - vsce_target: win32-x64
            asset: droast-windows-x86_64.exe

    steps:
      - name: Require Marketplace token
        if: env.VSCE_PAT == ''
        run: |
          echo "VSCE_PAT is required to publish the VS Code extension." >&2
          exit 1

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="$(git tag --points-at "$RELEASE_SHA" --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [[ -z "$tag" ]]; then
            echo "No release tag points at $RELEASE_SHA" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm install

      # Sync extension version with the release tag so Marketplace shows the
      # correct version and updates are offered to existing users.
      - name: Set extension version
        working-directory: vscode-extension
        run: npm pkg set version="${{ steps.release.outputs.version }}"

      - name: Download binary from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.release.outputs.version }}" \
            --pattern "${{ matrix.asset }}" \
            --dir vscode-extension/bin/ \
            --repo "${{ github.repository }}"

      - name: Make binary executable
        if: matrix.vsce_target != 'win32-x64'
        run: chmod +x vscode-extension/bin/${{ matrix.asset }}

      - name: Publish to VS Code Marketplace
        working-directory: vscode-extension
        run: vsce publish --target ${{ matrix.vsce_target }} -p "$VSCE_PAT"
