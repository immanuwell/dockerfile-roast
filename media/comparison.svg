<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Droast and Hadolint performance comparison</title>
  <desc id="desc">Droast completed the benchmark corpus in a median 191 milliseconds compared with Hadolint's 1,178 milliseconds, making Droast 6.16 times faster. The Droast binary is 4.58 megabytes compared with Hadolint's 54.73 megabytes, making it 11.94 times smaller.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#080a12" flood-opacity=".38"/>
    </filter>
    <linearGradient id="speed-gradient" x1="0" x2="1">
      <stop offset="0" stop-color="#ff5c64"/>
      <stop offset="1" stop-color="#ff9830"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" rx="22" fill="#1d1e28"/>
  <rect x="24" y="24" width="1152" height="452" rx="16" fill="#22232e" stroke="#393b4b"/>
  <text x="54" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.8" fill="#a6a8b7">BENCHMARK COMPARISON</text>
  <text x="54" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#d6d7df">121 Dockerfiles · 28,279 lines · lower is better</text>

  <line x1="600" y1="124" x2="600" y2="414" stroke="#393b4b"/>

  <text x="312" y="122" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#a6a8b7">FULL-CORPUS SCAN TIME</text>
  <g transform="translate(312 340)">
    <path d="M -190 0 A 190 190 0 0 1 190 0" fill="none" stroke="#393b4b" stroke-width="28" stroke-linecap="round"/>
    <path d="M -190 0 A 190 190 0 0 1 190 0" pathLength="100" fill="none" stroke="url(#speed-gradient)" stroke-width="28" stroke-linecap="round" stroke-dasharray="84 100"/>
    <line x1="-190" y1="15" x2="190" y2="15" stroke="#393b4b"/>
    <text y="-58" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="850" fill="#f2f3f5">6.16×</text>
    <text y="-28" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#ffca6b">FASTER</text>
    <circle cx="-159" cy="59" r="6" fill="#ff5c64"/>
    <text x="-145" y="65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#f2f3f5">droast</text>
    <text x="-60" y="65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#a6a8b7">191 ms</text>
    <circle cx="42" cy="59" r="6" fill="#63d8f3"/>
    <text x="56" y="65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#f2f3f5">Hadolint</text>
    <text x="145" y="65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#a6a8b7">1,178 ms</text>
  </g>

  <text x="888" y="122" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#a6a8b7">LINUX X86-64 BINARY SIZE</text>
  <g transform="translate(668 174)">
    <line x1="0" y1="210" x2="440" y2="210" stroke="#727584" stroke-width="1.5"/>
    <line x1="0" y1="140" x2="440" y2="140" stroke="#393b4b" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="0" y1="70" x2="440" y2="70" stroke="#393b4b" stroke-width="1" stroke-dasharray="4 6"/>
    <text x="-12" y="215" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#8c8f9e">0</text>
    <text x="-12" y="145" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#8c8f9e">20 MB</text>
    <text x="-12" y="75" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#8c8f9e">40 MB</text>
    <text x="-12" y="5" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#8c8f9e">60 MB</text>
    <rect x="90" y="194" width="92" height="16" rx="8" fill="#ff5c64"/>
    <rect x="272" y="18" width="92" height="192" rx="8" fill="#63d8f3"/>
    <text x="136" y="184" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="850" fill="#f2f3f5">4.58</text>
    <text x="136" y="235" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff8389">droast</text>
    <text x="318" y="8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="850" fill="#f2f3f5">54.73</text>
    <text x="318" y="235" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#8ae5fa">Hadolint</text>
  </g>
  <rect x="757" y="418" width="262" height="32" rx="16" fill="#353746"/>
  <text x="888" y="440" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffca6b">11.94× SMALLER</text>
</svg>
